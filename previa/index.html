<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prévia — Site do Clube (Associação Volvo)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0d0f; --cab:#0b3a44; --teal:#14788c; --teal-escuro:#0c5868; --teal-claro:#3fa7bd; --laranja:#d95926;
    --ink:#f4f4f2; --soft:#d3dde0; --soft2:#a3a8b6;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--bg); color:var(--ink); font-family:"Inter",system-ui,"Segoe UI",sans-serif; }

  /* ---------- simulação do SharePoint ---------- */
  .aviso { background:var(--laranja); color:#fff; text-align:center; font-size:13px; font-weight:700; padding:8px 12px; }
  .sp-barra { background:#000; color:#fff; height:40px; display:flex; align-items:center; gap:18px; padding:0 16px; font:600 14px "Segoe UI",sans-serif; }
  .sp-cab { background:var(--cab); display:flex; align-items:center; gap:26px; padding:16px 24px; }
  .sp-cab .logo-txt { font-family:"Montserrat"; font-weight:800; font-size:20px; color:#fff; white-space:nowrap; text-decoration:none; }
  .sp-cab h2 { font:700 22px "Segoe UI",sans-serif; color:#fff; }

  /* ---------- fundo com a foto do Centro de Eventos ---------- */
  .pagina { position:relative; min-height:calc(100vh - 128px); overflow:hidden; }
  .foto { position:absolute; inset:0; background:url('centro-de-eventos.jpg') center 55%/cover no-repeat; }
  .pagina.home .foto { transform:scale(1.08); animation:aproxima 16s ease-out forwards; }
  @keyframes aproxima { to { transform:scale(1); } }
  .veu { position:absolute; inset:0; background:
      linear-gradient(90deg, rgba(5,10,12,.90) 0%, rgba(5,10,12,.66) 45%, rgba(5,10,12,.48) 100%),
      linear-gradient(0deg, rgba(5,10,12,.85) 0%, transparent 45%); }
  .pagina.interna .veu { background:linear-gradient(180deg, rgba(5,10,12,.78) 0%, rgba(5,10,12,.93) 260px, rgba(11,13,15,1) 520px); }
  .pagina.interna .foto { height:520px; }

  /* ---------- HOME ---------- */
  .home-conteudo { position:relative; max-width:1440px; margin:0 auto; padding:56px 40px; min-height:calc(100vh - 128px);
    display:grid; grid-template-columns:minmax(300px,.9fr) 2fr; gap:48px; align-items:center; }
  .marca { grid-column:1; }
  .marca .nome { font-family:"Montserrat"; font-weight:900; line-height:.95; font-size:clamp(46px,5.6vw,84px); letter-spacing:-1px; }
  .marca .nome span { display:block; }
  .filete { width:90px; height:6px; border-radius:6px; margin:22px 0 18px; background:linear-gradient(90deg,#063a45 0%,#0c5868 30%,#14788c 65%,#3fa7bd 100%); }
  .marca .clube { font-family:"Montserrat"; font-weight:900; font-size:clamp(56px,7vw,104px); letter-spacing:10px; line-height:1; color:#fff; text-shadow:0 6px 24px rgba(0,0,0,.5); }
  .marca .filete { width:min(100%,330px); height:8px; margin:20px 0 18px; box-shadow:0 4px 14px rgba(20,120,140,.45); }
  .marca .desc { margin-top:18px; font-size:16px; line-height:1.6; color:var(--soft); max-width:380px; }

  .intro .marca { animation:marcaEntra 2.6s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes marcaEntra {
    0%   { opacity:0; transform:translateX(var(--centro,30vw)) scale(1.25); filter:blur(8px); }
    25%  { opacity:1; transform:translateX(var(--centro,30vw)) scale(1.25); filter:blur(0); }
    55%  { opacity:1; transform:translateX(var(--centro,30vw)) scale(1.25); }
    70%  { opacity:.55; }
    100% { opacity:1; transform:none; filter:none; }
  }
  .intro .marca .filete { animation:estica .9s cubic-bezier(.2,.7,.2,1) both; animation-delay:2.2s; transform-origin:left; }
  @keyframes estica { from { opacity:0; transform:scaleX(0); } to { opacity:1; transform:none; } }
  .intro .marca .desc { animation:aparece .8s ease both; animation-delay:2.6s; }
  @keyframes aparece { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  /* cartões altos, no azul-petróleo dos botões 3D */
  .cartoes { grid-column:2; display:grid; grid-template-columns:repeat(5,1fr); gap:18px; }
  .cartao { position:relative; display:flex; flex-direction:column; justify-content:space-between; min-height:210px; padding:20px 18px 18px;
    border-radius:18px; text-decoration:none; color:#fff; overflow:hidden;
    background:linear-gradient(180deg,#1b93ab 0%,#14788c 45%,#0c5868 100%); border:1px solid rgba(255,255,255,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.18), 0 7px 0 #063a45, 0 20px 34px rgba(0,0,0,.55);
    transition:transform .2s ease, box-shadow .2s ease, filter .2s; }
  .cartao:hover { filter:brightness(1.1); transform:translateY(-6px); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 12px 0 #063a45, 0 28px 40px rgba(0,0,0,.6); }
  .cartao:active { transform:translateY(5px); box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 2px 0 #063a45, 0 8px 14px rgba(0,0,0,.5); }
  .cartao .ic { width:52px; height:52px; border-radius:14px; display:grid; place-items:center; background:rgba(255,255,255,.15); box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 3px 8px rgba(0,0,0,.25); }
  .cartao .ic svg { width:28px; height:28px; }
  .cartao .titulo { font-family:"Montserrat"; font-weight:800; font-size:15px; letter-spacing:.4px; line-height:1.25; margin-top:18px; text-shadow:0 2px 4px rgba(0,0,0,.3); }
  .cartao .sub { font-size:12.5px; color:#d6eef2; margin-top:6px; line-height:1.4; }
  .cartao .ir { margin-top:14px; font-size:12px; font-weight:700; letter-spacing:1.5px; color:#cfeff5; }
  .intro .cartao { animation:cartaoEntra .7s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(2.3s + var(--i) * 90ms); }
  @keyframes cartaoEntra { from { opacity:0; transform:translateY(40px) scale(.96); } to { opacity:1; transform:none; } }

  svg.i { fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- PÁGINAS INTERNAS ---------- */
  .interna-conteudo { position:relative; max-width:1180px; margin:0 auto; padding:34px 24px 80px; text-align:center; animation:aparece .5s ease both; }
  .topo-pag { display:flex; justify-content:flex-start; }
  .voltar { display:inline-flex; align-items:center; gap:8px; margin-bottom:16px; padding:9px 16px; border-radius:999px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; font:700 13px "Montserrat"; text-decoration:none; }
  .voltar:hover { background:rgba(255,255,255,.16); }
  .trilha { text-align:left; font-size:13px; color:var(--soft2); margin-bottom:18px; display:flex; flex-wrap:wrap; gap:6px; }
  .trilha a { color:var(--teal-claro); text-decoration:none; font-weight:700; }
  .trilha a:hover { text-decoration:underline; }
  h1 { font-family:"Montserrat"; font-size:clamp(24px,4vw,36px); font-weight:800; letter-spacing:.5px; }
  .interna-conteudo .filete { margin:14px auto 12px; }
  .subt { color:var(--soft2); font-size:15px; margin-bottom:30px; }
  .botoes { display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:18px 16px; }
  .btn3d { display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:13px; text-decoration:none; color:#fff; text-align:left;
    background:linear-gradient(180deg,#1b93ab 0%,#14788c 45%,#0c5868 100%); border:1px solid rgba(255,255,255,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.18), 0 5px 0 #063a45, 0 12px 20px rgba(0,0,0,.5);
    transition:transform .12s ease, box-shadow .12s ease, filter .2s; animation:cartaoEntra .45s ease both; animation-delay:calc(var(--i,0) * 35ms); }
  .btn3d:hover { filter:brightness(1.08); transform:translateY(-2px); }
  .btn3d:active { transform:translateY(4px); box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 1px 0 #063a45, 0 6px 12px rgba(0,0,0,.5); }
  .btn3d .ic { flex:none; width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:rgba(255,255,255,.14); box-shadow:inset 0 1px 0 rgba(255,255,255,.3); }
  .btn3d .ic svg { width:21px; height:21px; }
  .btn3d .titulo { display:block; font-size:12.5px; font-weight:800; letter-spacing:.3px; line-height:1.25; text-shadow:0 2px 4px rgba(0,0,0,.3); word-break:break-word; }
  .btn3d .sub { display:block; font-size:11px; opacity:.85; margin-top:3px; }
  .btn3d .seta { margin-left:auto; opacity:.8; font-size:18px; font-weight:700; }
  .final { max-width:640px; margin:10px auto 0; padding:26px; border-radius:18px; background:rgba(255,255,255,.05); border:1px dashed rgba(255,255,255,.25); color:var(--soft2); line-height:1.6; font-size:14.5px; }
  .final b { color:#fff; }

  .rever { position:fixed; right:18px; bottom:18px; z-index:5; border:1px solid rgba(255,255,255,.25); background:rgba(11,13,15,.8); color:#fff; padding:10px 16px; border-radius:999px; font:600 13px "Inter"; cursor:pointer; }
  .rever:hover { background:var(--teal); }

  @media (max-width:1180px) { .cartoes { grid-template-columns:repeat(3,1fr); } }
  @media (max-width:820px) {
    .home-conteudo { grid-template-columns:1fr; padding:36px 18px 80px; gap:30px; }
    .marca, .cartoes { grid-column:1; }
    .cartoes { grid-template-columns:1fr 1fr; gap:14px; }
    .cartao { min-height:170px; padding:16px 14px; }
    .intro .marca { animation-name:marcaEntraMobile; }
    @keyframes marcaEntraMobile { 0% { opacity:0; transform:scale(1.15); filter:blur(6px); } 40% { opacity:1; transform:scale(1.15); filter:none; } 100% { opacity:1; transform:none; } }
    .botoes { grid-template-columns:1fr 1fr; gap:12px 10px; }
  }
</style>
</head>
<body>
  <div class="aviso">PRÉVIA — clique nos cartões e botões para navegar. Pastas de exemplo, nomes genéricos.</div>
  <div class="sp-barra">VIOLIN &nbsp; SharePoint</div>
  <div class="sp-cab">
    <a class="logo-txt" href="#/">Associação Volvo</a>
    <h2>Clube</h2>
  </div>
  <main class="pagina" id="pagina"><div class="foto"></div><div class="veu"></div><div id="app"></div></main>
  <button class="rever" id="rever" type="button" hidden>↻ Ver a abertura de novo</button>

<script>
// ---------------- ícones ----------------
const IC = {
  pasta:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  imagem:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',
  grafico:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  pesquisa:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/>',
  calendario:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h2M14 14h2M8 18h2"/>',
  abrir:'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>',
  grade:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  listaSimples:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  paginas:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  equipe:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  dinheiro:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  contrato:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  video:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4z"/>',
  pessoa:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
  megafone:'<path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/>',
  trofeu:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  carrinho:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  limpeza:'<path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/>',
  estudo:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
  alvo:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  planta:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',
  predio:'<path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-5h6v5M9 10h.01M15 10h.01"/>',
  escudo:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  globo:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
  relogio:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  caixa:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>',
  lista:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  estrela:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  festa:'<path d="M5.8 11.3L2 22l10.7-3.8"/><path d="M4 3h.01M22 8h.01M15 2h.01M22 20h.01M22 2l-2.2.8a2.9 2.9 0 0 0-1.9 3l.1.6a2.9 2.9 0 0 1-1.9 3L14 10"/><path d="M11 13l1.5 1.5"/>',
  computador:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>'
};
const svg = k => `<svg class="i" viewBox="0 0 24 24">${IC[k] || IC.pasta}</svg>`;

// ícone pelo tema do nome
const sem = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const REGRAS = [
  [/health|safety|seguranca/, 'escudo'],
  [/financ|nota|despesa|valores/, 'dinheiro'],
  [/pesquisa/, 'pesquisa'],
  [/integra|treinamento|curso|estagi/, 'estudo'],
  [/foto|drone|png|imag/, 'camera'],
  [/video|sipat/, 'video'],
  [/logo|selo|marca/, 'imagem'],
  [/lazer/, 'festa'],
  [/calend|agenda|escala|reserva|^20\d\d$/, 'calendario'],
  [/contrato|termo|lgpd|dpa|protocolo|documento|descritivo|ppt|procedimento|rd'?s?$|^rd$|a3|sg3|responsabilidade|escopo/, 'contrato'],
  [/comunica|divulga|mailing|hot site|apresenta/, 'megafone'],
  [/esport|soccer|runners|oliviking|trilha|capoeira|clube gazeta/, 'trofeu'],
  [/compra|emporio/, 'carrinho'],
  [/limpeza/, 'limpeza'],
  [/vps|kaizen|meta|projeto|planejamento|ebd/, 'alvo'],
  [/layout|planta|dwg|pdf|plotagem/, 'planta'],
  [/centro de eventos|salao|memorial|obra/, 'predio'],
  [/festa|colonia|familia|45 anos|40 anos|social|crianca|julina/, 'festa'],
  [/english/, 'globo'],
  [/horas/, 'relogio'],
  [/almoxarifado|materiais/, 'caixa'],
  [/limitador|formulario|cadastro|lista/, 'lista'],
  [/premia|vitalicio|conselho/, 'estrela'],
  [/desktop|sistema|relatorio/, 'computador'],
  [/associacao volvo|av clube|^av$|volvo|clube/, 'predio'],
  [/socio|equipe|time/, 'equipe']
];
function iconePara(nome, padrao) { const n = sem(nome); for (const [re, ic] of REGRAS) if (re.test(n)) return ic; return padrao || 'pasta'; }
const alfa = (a, b) => sem(a).localeCompare(sem(b), 'pt-BR', { numeric: true });
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const up = s => s.toLocaleUpperCase('pt-BR');
const itens = n => n === 0 ? 'Pasta de exemplo' : (n === 1 ? '1 subpasta' : n + ' subpastas');
const link = (...p) => '#/' + p.map(encodeURIComponent).join('/');

// ---------------- dados (pastas lidas do SharePoint) ----------------
// Pastas de EXEMPLO (nomes genéricos — versão pública da prévia)
const DOCS = [
 ["Administração",6,["Compras","Contratos","Escala","Limpeza","Projetos","Reservas"]],
 ["Comunicação",4,["Apresentações","Divulgações","Fotos de eventos","Vídeos"]],
 ["Contratos",2,["Contratos ativos","Termos"]],
 ["Eventos",3,["Colônia de Férias","Festa da Criança","Festa Julina"]],
 ["Fotos",3,["2024","2025","2026"]],
 ["Integração",2,["Cursos","Treinamentos"]],
 ["Lazer",3,["Agenda","Atividades esportivas","Atividades sociais"]],
 ["Logos",2,["Logos AV","Selos"]],
 ["Metas",2,["2025","2026"]],
 ["Pesquisas",3,["2024","2025","2026"]],
 ["Projetos",0,[]],
 ["Segurança",2,["Orientações","Vídeos de segurança"]],
 ["VPS",3,["2025","2026","Kaizen"]]
];
const LOGOS = [["AV",0],["Colônia de Férias",0],["Espaço Soccer",0],["Oliviking",0],["Selo 45 Anos AV",0],["Volvo",0]];

// Itens do menu lateral (página inicial), em ordem alfabética
const MENU = [
  ['calendario', 'Calendário anual de eventos', 'calendario', 'Eventos do ano'],
  ['conteudo',   'Conteúdo do site',            'grade',      'Listas e bibliotecas'],
  ['documentos', 'Documentos',                  'pasta',      'Todas as pastas da AV'],
  ['kpis',       'KPIs e Metas',                'grafico',    'Pesquisas e calendário'],
  ['limitador',  'Lista de limitador',          'listaSimples','Lista do SharePoint'],
  ['logos',      'Logos',                       'imagem',     'Logos e selos da AV'],
  ['paginas',    'Páginas',                     'paginas',    'Páginas do site'],
  ['parent',     'Parent Team',                 'equipe',     'Equipe no Teams'],
  ['formulario', 'Teste formulário',            'lista',      'Lista do SharePoint'],
  ['africa',     'Teste limitador Africa',      'globo',      'Lista do SharePoint']
];

// ---------------- peças de tela ----------------
function botao(href, icone, titulo, desc, i) {
  return `<a class="btn3d" href="${href}" style="--i:${i || 0}"><span class="ic">${svg(icone)}</span>` +
         `<span><span class="titulo">${esc(up(titulo))}</span><span class="sub">${esc(desc)}</span></span><span class="seta">›</span></a>`;
}
function topo(titulo, sub, trilha) {
  const voltar = trilha.length > 1 ? trilha[trilha.length - 2][1] : '#/';
  return `<div class="topo-pag"><a class="voltar" href="${voltar}">‹ Voltar</a></div>` +
    `<div class="trilha">${trilha.map((p, i) => i < trilha.length - 1 ? `<a href="${p[1]}">${esc(p[0])}</a> ›` : `<span>${esc(p[0])}</span>`).join(' ')}</div>` +
    `<h1>${esc(up(titulo))}</h1><div class="filete"></div><p class="subt">${esc(sub)}</p>`;
}
const final = t => `<div class="final">${t}</div>`;
const interna = html => `<div class="interna-conteudo">${html}</div>`;

// ---------------- telas ----------------
function home() {
  return `<div class="home-conteudo">
    <div class="marca" id="marca">
      <div class="clube">CLUBE</div>
      <div class="filete"></div>
      <p class="desc">Tudo do clube em um só lugar. Escolha uma área para acessar.</p>
    </div>
    <nav class="cartoes" aria-label="Áreas do site">${MENU.map((m, i) =>
      `<a class="cartao" href="${link(m[0])}" style="--i:${i}"><div><div class="ic">${svg(m[2])}</div>
         <p class="titulo">${esc(up(m[1]))}</p><p class="sub">${esc(m[3])}</p></div><p class="ir">ACESSAR ›</p></a>`).join('')}
    </nav></div>`;
}

let jaAbriu = false;
function render() {
  const partes = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  const pag = document.getElementById('pagina');
  const app = document.getElementById('app');
  const INICIO = ['Início', '#/'];
  document.getElementById('rever').hidden = partes.length > 0;

  if (partes.length === 0) {
    pag.className = 'pagina home';
    app.innerHTML = home();
    if (!jaAbriu) { abrir(); jaAbriu = true; } else { pag.classList.remove('intro'); }
    window.scrollTo(0, 0);
    return;
  }

  pag.className = 'pagina interna';
  const area = MENU.find(m => m[0] === partes[0]);
  const nomeArea = area ? area[1] : partes[0];
  let html = '';

  if (partes[0] === 'documentos' && partes.length === 1) {
    const ord = [...DOCS].sort((a, b) => alfa(a[0], b[0]));
    html = topo('Documentos', 'Cada pasta é um botão. Clique para entrar.', [INICIO, ['Documentos', link('documentos')]]) +
      `<div class="botoes">${ord.map((d, i) => botao(link('documentos', d[0]), iconePara(d[0]), d[0], itens(d[1]), i)).join('')}</div>`;
  } else if (partes[0] === 'documentos') {
    const d = DOCS.find(x => x[0] === partes[1]);
    const trilha = [INICIO, ['Documentos', link('documentos')], [partes[1], link('documentos', partes[1])]];
    if (partes.length === 2 && d && d[2].length) {
      html = topo(d[0], 'Subpastas desta pasta.', trilha) +
        `<div class="botoes">${[...d[2]].sort(alfa).map((s, i) => botao(link('documentos', d[0], s), iconePara(s), s, 'Abrir subpasta', i)).join('')}` +
        botao(link('documentos', d[0], '__arquivos'), 'abrir', 'Ver arquivos desta pasta', 'Abre a pasta no SharePoint', d[2].length) + `</div>`;
    } else {
      const nome = partes.length > 2 ? (partes[2] === '__arquivos' ? 'Arquivos' : partes[2]) : partes[1];
      if (partes.length > 2) trilha.push([nome, location.hash]);
      html = topo(nome, 'Aqui termina a navegação por botões.', trilha) +
        final(`No site de verdade, este botão <b>abre a pasta no SharePoint</b> (na mesma aba), com a lista de arquivos de sempre: abrir, baixar, enviar e compartilhar continuam funcionando normalmente.`);
    }
  } else if (partes[0] === 'logos' && partes.length === 1) {
    html = topo('Logos', 'Logos e selos, separados por pasta.', [INICIO, ['Logos', link('logos')]]) +
      `<div class="botoes">${[...LOGOS].sort((a, b) => alfa(a[0], b[0])).map((l, i) => botao(link('logos', l[0]), iconePara(l[0], 'imagem'), l[0], itens(l[1]), i)).join('')}</div>`;
  } else if (partes[0] === 'logos') {
    html = topo(partes[1], 'Aqui termina a navegação por botões.', [INICIO, ['Logos', link('logos')], [partes[1], location.hash]]) +
      final(`No site de verdade, este botão <b>abre a pasta de logos no SharePoint</b>, com as imagens para ver e baixar.`);
  } else if (partes[0] === 'kpis' && partes.length === 1) {
    html = topo('KPIs e Metas', 'Indicadores dos projetos da Associação Volvo-Clube. Escolha um painel.', [INICIO, ['KPIs e Metas', link('kpis')]]) +
      `<div class="botoes" style="max-width:640px;margin:0 auto">` +
        botao(link('kpis', 'Pesquisas de Satisfação'), 'pesquisa', 'Pesquisas de Satisfação', 'Opinião dos associados por evento', 0) +
        botao(link('kpis', 'Calendário de Atividades'), 'calendario', 'Calendário de Atividades', 'Execução das atividades de 2026', 1) +
      `</div>`;
  } else if (partes[0] === 'kpis') {
    html = topo(partes[1], 'Painel embutido.', [INICIO, ['KPIs e Metas', link('kpis')], [partes[1], location.hash]]) +
      final(`No site de verdade, aqui aparece o <b>painel completo</b> (como já está hoje), com o botão <b>Tela cheia</b>.`);
  } else {
    html = topo(nomeArea, 'Aqui termina a navegação por botões.', [INICIO, [nomeArea, location.hash]]) +
      final(`No site de verdade, este cartão <b>abre "${esc(nomeArea)}" no SharePoint</b>, na mesma aba, como acontece hoje pelo menu lateral.`);
  }
  app.innerHTML = interna(html);
  window.scrollTo(0, 0);
}

// abertura: a marca começa no centro da tela e vai para a esquerda
function abrir() {
  const pag = document.getElementById('pagina');
  const m = document.getElementById('marca');
  if (!m) return;
  pag.classList.remove('intro');
  m.style.animation = 'none';
  const r = m.getBoundingClientRect();
  m.style.setProperty('--centro', ((innerWidth / 2) - (r.left + r.width / 2)) + 'px');
  void m.offsetWidth;
  m.style.animation = '';
  pag.classList.add('intro');
}
document.getElementById('rever').onclick = () => { if (location.hash && location.hash !== '#/') location.hash = '#/'; else abrir(); };
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
